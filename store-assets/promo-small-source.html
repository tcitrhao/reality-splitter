<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Splitter Small Promo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 30% 20%, rgba(213, 235, 222, 0.2), transparent 42%),
          linear-gradient(140deg, #163f35, #28604e);
      }

      .line {
        position: absolute;
        width: 360px;
        height: 1px;
        background: rgba(237, 241, 228, 0.22);
        transform: rotate(-28deg);
      }

      .line:nth-child(1) {
        top: 76px;
        left: -42px;
      }

      .line:nth-child(2) {
        right: -28px;
        bottom: 62px;
      }

      .line:nth-child(3) {
        top: 140px;
        right: -120px;
        opacity: 0.5;
        transform: rotate(18deg);
      }

      .mark {
        position: relative;
        display: grid;
        width: 128px;
        height: 128px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 34px;
        background: rgba(15, 51, 42, 0.86);
        box-shadow: 0 28px 60px rgba(4, 27, 21, 0.28);
      }

      .mark::before,
      .mark::after {
        position: absolute;
        width: 52px;
        height: 1px;
        background: rgba(234, 241, 225, 0.36);
        content: "";
      }

      .mark::before {
        top: 30px;
        right: -34px;
      }

      .mark::after {
        bottom: 30px;
        left: -34px;
      }

      .mark span {
        color: #f0f0df;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.11em;
        line-height: 1;
        transform: translateX(-4px);
      }
    </style>
  </head>
  <body>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="mark" aria-label="Reality Splitter">
      <span>R</span>
    </div>
  </body>
</html>
