<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reality Splitter Drawer Harness</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        color: #21342c;
        background: #f3efe5;
        font: 16px/1.7 Georgia, serif;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }
    </style>
    <script>
      const runtimeListeners = [];

      window.chrome = {
        runtime: {
          onMessage: {
            addListener(listener) {
              runtimeListeners.push(listener);
            }
          },
          async sendMessage(message) {
            if (message.type === "OPEN_MODEL_ADMIN") {
              document.documentElement.dataset.modelAdminRequestCount = String(
                Number(document.documentElement.dataset.modelAdminRequestCount || "0") + 1
              );
              return { ok: true };
            }

            document.documentElement.dataset.lastRuntimeInput = message.payload?.input?.text || "";
            document.documentElement.dataset.analysisRequestCount = String(
              Number(document.documentElement.dataset.analysisRequestCount || "0") + 1
            );

            if (message.type === "RUN_INLINE_LONGFORM_CHECK") {
              document.documentElement.dataset.longformRequestCount = String(
                Number(document.documentElement.dataset.longformRequestCount || "0") + 1
              );
              await new Promise((resolve) => window.setTimeout(resolve, 280));
              return {
                ok: true,
                data: {
                  mode: "longform",
                  result: {
                    facts: [
                      {
                        claim: "测试事实",
                        verdict: "supported",
                        evidenceNote: "用于验证长文结果状态。",
                        sourceHint: "测试夹具"
                      }
                    ],
                    opinions: []
                  }
                }
              };
            }

            if (message.type !== "RUN_INLINE_ANALYSIS") {
              return { ok: false, error: "Unsupported test message" };
            }

            document.documentElement.dataset.quickRequestCount = String(
              Number(document.documentElement.dataset.quickRequestCount || "0") + 1
            );
            await new Promise((resolve) => window.setTimeout(resolve, 360));
            return {
              ok: true,
              data: {
                mode: "split",
                result: {
                  attentionTriage: {
                    recommendedAction: "verify",
                    attentionCost: "medium",
                    reason: "内容提出了可核查主张，但当前没有给出来源。",
                    nextStep: "先寻找原始来源，再决定是否投入更多注意力。"
                  },
                  propagationLabels: ["缺少来源"],
                  observableFacts: ["原文包含一个可核查的预测。"],
                  opinions: [],
                  inferences: ["预测被表达为较确定的结论。"],
                  predictions: ["该行业将在两年内发生重大变化。"],
                  anxietyThemes: [],
                  viralityHooks: [],
                  manipulationSignals: [],
                  sourceReliabilityIssues: ["没有提供原始来源。"],
                  callsToAction: [],
                  neutralRewrite: "这是一项尚待来源验证的行业预测。"
                }
              }
            };
          }
        }
      };

      window.openRealitySplitterDrawer = (workspaceMode = "quick") => {
        const listener = runtimeListeners.at(-1);
        listener(
          {
            type: "REALITY_SPLITTER_SHOW_INLINE_V6",
            payload: {
              input: {
                text: "有人预测，这个行业将在两年内发生重大变化。",
                url: window.location.href
              },
              workspaceMode
            }
          },
          {},
          (response) => {
            document.documentElement.dataset.drawerAck = JSON.stringify(response);
          }
        );
      };
    </script>
  </head>
  <body>
    <div
      id="reality-splitter-inline-panel"
      class="reality-splitter-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Reality Splitter"
      style="position: fixed; inset: 18%; border-radius: 24px"
    >
      旧版本弹窗
    </div>
    <main>
      <h1>抽屉测试页</h1>
      <p>这个页面会先放入一个旧版本弹窗，再加载当前构建，不连接真实模型。</p>
      <p>打开后，旧节点必须被替换为固定在左侧的 aside 抽屉。</p>
      <button type="button" onclick="window.openRealitySplitterDrawer('quick')">
        模拟右键发送到短文模式
      </button>
      <button type="button" onclick="window.openRealitySplitterDrawer('longform')">
        模拟右键发送到长文模式
      </button>
    </main>
    <script src="/dist/contentScript.js"></script>
    <script>
      document.documentElement.dataset.analysisRequestCount = "0";
      document.documentElement.dataset.quickRequestCount = "0";
      document.documentElement.dataset.longformRequestCount = "0";
      document.documentElement.dataset.modelAdminRequestCount = "0";
      window.openRealitySplitterDrawer();
    </script>
  </body>
</html>
